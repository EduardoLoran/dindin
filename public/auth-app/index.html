<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7A41C0" />
    <meta name="description" content="Acesse sua conta no Dindin." />
    <link rel="icon" type="image/svg+xml" href="/auth-app/favicon.svg" />
    <title>Dindin | Acesso</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem("dindin-theme");
        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const theme = ["light", "dark"].includes(storedTheme) ? storedTheme : systemTheme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script type="module" crossorigin src="/auth-app/assets/index-BGLj2IBz.js"></script>
    <link rel="stylesheet" crossorigin href="/auth-app/assets/index-BUf9E2FV.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
